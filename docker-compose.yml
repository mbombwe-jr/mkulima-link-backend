services:
  api:
    build: .
    env_file: .env
    environment:
      PORT: ${API_PORT:-3111}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://mkulima:mkulima@postgres:5432/mkulima_link?schema=public}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379}
    ports: ["${API_PORT:-3111}:${API_PORT:-3111}"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  migrate:
    build:
      context: .
      target: build
    env_file: .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://mkulima:mkulima@postgres:5432/mkulima_link?schema=public}
    command: sh -c "npm run prisma:deploy && npm run prisma:seed"
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mkulima_link
      POSTGRES_USER: mkulima
      POSTGRES_PASSWORD: mkulima
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mkulima -d mkulima_link"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
