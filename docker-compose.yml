services:
  api:
    build: .
    env_file: .env
    ports: ["3111:3111"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mkulima_link
      POSTGRES_USER: mkulima
      POSTGRES_PASSWORD: mkulima
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mkulima -d mkulima_link"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
